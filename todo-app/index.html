<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Minha Lista de Tarefas</h1>
        <p>Gerencie suas atividades com persistência local (LocalStorage) e CI/CD.</p>

        <div class="input-group">
            <input type="text" id="nova-tarefa" placeholder="O que você precisa fazer?" autofocus>
            <button onclick="adicionarTarefa()">Adicionar</button>
        </div>

        <ul id="lista-tarefas"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
